services:
  postgres:
    image: postgres:16
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_pass
    ports:
      - "5433:5432"
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    ports:
      - "6379:6379"

volumes:
  payflow_pgdata: